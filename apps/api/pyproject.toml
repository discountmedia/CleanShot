[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleanshot-api"
version = "0.1.0"
description = "CleanShot FastAPI backend — Phase 2 v2.5"
requires-python = ">=3.12"

dependencies = [
    # Web framework — Pydantic v1 deprecated, strict Content-Type ON by default
    "fastapi==0.136.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.3",  # BaseSettings for config.py — separate package since Pydantic v2
    "uvicorn[standard]>=0.34",

    # AI SDKs — exact pins where bugs exist, floor pins elsewhere
    # DO NOT use google-genai 1.67.0 (typing-extensions bug) or 1.73.0 (webhook regression)
    "google-genai[aiohttp]==1.75.0",
    "openai>=1.68",          # gpt-5.4 + Responses API GA
    "anthropic>=0.51",       # GA structured output + output_config

    # Google Cloud
    "google-cloud-tasks>=2.16",   # v2 API; stable
    "google-cloud-storage>=2.18",
    "google-auth>=2.38",          # ADC / Vertex AI IAM auth

    # Database
    "asyncpg>=0.30",         # Async Postgres driver

    # Image processing
    "pyvips>=2.2",           # libvips 8.18+ must be present in OS layer

    # Cache (Valkey 9.0 / Memorystore)
    "valkey>=6.0",           # Valkey-native client (drop-in redis.asyncio API)

    # Auth / security
    "python-jose[cryptography]>=3.3",  # OIDC token verification for Cloud Tasks worker

    # Utilities
    "httpx>=0.27",           # Async HTTP client for internal calls
    "tenacity>=9.0",         # Retry with exponential backoff
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cleanshot_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "A"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
