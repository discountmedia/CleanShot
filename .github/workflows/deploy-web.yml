name: Deploy Web

# 2026-05-27: Vercel CI pipeline restored after ~12 hours of failed runs.
# Root cause was the VERCEL_TOKEN secret missing from repo Settings →
# Secrets and variables → Actions (VERCEL_ORG_ID + VERCEL_PROJECT_ID were
# present but the token wasn't — the action then threw
# "Input required and not supplied: vercel-token" before any deploy work
# started). Token re-minted at https://vercel.com/account/tokens and
# re-saved; this trivial header edit re-triggers the workflow to
# confirm the green path end-to-end.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/types/**'
      - 'vercel.json'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.1.2'

      - run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token:      ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:     ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args:       '--prod'
          working-directory: apps/web
