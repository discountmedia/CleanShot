name: Deploy Web (manual)

# MANUAL ONLY as of 2026-08-13. This no longer runs on push, and that is
# deliberate.
#
# Vercel's own Git integration is what actually deploys this app to production
# on a push to main. This workflow has FAILED on every run since 2026-06-05 --
# at the `pnpm audit --audit-level=high` step, before it ever reached the deploy
# -- while production deploys landed anyway. So it was never the deploy path;
# it was a permanently-red status that trained everyone to ignore a failing
# workflow, which is worse than having no workflow.
#
# Leaving it on `push` carried a second, sharper risk: the moment somebody
# "fixed" the audit gate, this would start deploying via the CLI *in addition to*
# Vercel's Git integration -- two production deploys per push racing for the
# same alias.
#
# Kept rather than deleted because the CLI recipe below is hard-won (see the
# comments on the deploy step, plus lessons #22 and #23 in CLAUDE.md) and is the
# emergency path if the Git integration is ever disconnected. Run it from the
# Actions tab.
#
# Original note, kept for history -- 2026-05-27: pipeline restored after ~12
# hours of failed runs. Root cause was the VERCEL_TOKEN secret missing from repo
# Settings -> Secrets and variables -> Actions (VERCEL_ORG_ID +
# VERCEL_PROJECT_ID were present but the token wasn't; the action threw
# "Input required and not supplied: vercel-token" before any deploy work
# started).

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.1.2'

      - run: pnpm install --frozen-lockfile

      # Audit intentionally NOT run here. It lives in its own ci.yml job now.
      # An emergency manual deploy must not be blocked by a transitive advisory.
      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Deploy via the official Vercel CLI directly. The third-party
      # amondnet/vercel-action@v25 wrapper pinned vercel@25.1.0, which
      # is ~22 major versions behind current and gets rejected by
      # Vercel's API with "this endpoint requires version 47.2.2 or
      # later". Running the CLI ourselves keeps us on @latest, drops
      # a third-party dependency, and removes the Node.js 20 forced
      # by the wrapper.
      #
      # IMPORTANT: NO `working-directory: apps/web` here. The Vercel
      # project has Root Directory = "apps/web" configured in its
      # dashboard settings, and the CLI applies that on top of the
      # current working directory. If we cd into apps/web first, the
      # CLI then tries apps/web/apps/web/package.json and ENOENTs.
      # Running from the repo root lets the project's Root Directory
      # setting drill into apps/web cleanly (same shape as the manual
      # `npx vercel --prod` we did from c:\dev\CleanShot).
      #
      # VERCEL_ORG_ID + VERCEL_PROJECT_ID are read automatically from
      # the env block; only --token has to be passed explicitly.
      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
