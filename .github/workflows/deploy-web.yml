name: Deploy Web

# 2026-05-27: Vercel CI pipeline restored after ~12 hours of failed runs.
# Root cause was the VERCEL_TOKEN secret missing from repo Settings →
# Secrets and variables → Actions (VERCEL_ORG_ID + VERCEL_PROJECT_ID were
# present but the token wasn't — the action then threw
# "Input required and not supplied: vercel-token" before any deploy work
# started). Token re-minted at https://vercel.com/account/tokens and
# re-saved; this trivial header edit re-triggers the workflow to
# confirm the green path end-to-end.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/types/**'
      - 'vercel.json'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.1.2'

      - run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Deploy via the official Vercel CLI directly. The third-party
      # amondnet/vercel-action@v25 wrapper pinned vercel@25.1.0, which
      # is ~22 major versions behind current and gets rejected by
      # Vercel's API with "this endpoint requires version 47.2.2 or
      # later". Running the CLI ourselves keeps us on @latest, drops
      # a third-party dependency, and removes the Node.js 20 forced
      # by the wrapper (this step now runs on the setup-node step's
      # Node 22 / Node 24).
      #
      # VERCEL_ORG_ID + VERCEL_PROJECT_ID are read automatically from
      # the env block; only --token has to be passed explicitly.
      - name: Deploy to Vercel
        working-directory: apps/web
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
