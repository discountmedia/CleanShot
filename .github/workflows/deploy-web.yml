name: Deploy Web

# 2026-05-27: Vercel CI pipeline was failing on "vercel-token not supplied"
# for ~12 hours after the previous secrets rotated out / expired. Restored
# VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID in repo Settings →
# Secrets and variables → Actions. This trivial header edit re-triggers
# the workflow as a smoke test that the new values authenticate correctly.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/types/**'
      - 'vercel.json'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.1.2'

      - run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token:      ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:     ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args:       '--prod'
          working-directory: apps/web
