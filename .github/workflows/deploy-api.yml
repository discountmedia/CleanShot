name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/deploy-api.yml'

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: cleanshot-493512
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/cleanshot-493512/cleanshot/api

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/387208973244/locations/global/workloadIdentityPools/github-pool/providers/github-provider'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGISTRY --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            -f apps/api/Dockerfile \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy forklift-api \
            --image=$IMAGE:${{ github.sha }} \
            --region=$REGION \
            --network=default \
            --subnet=cloud-run-subnet \
            --vpc-egress=private-ranges-only \
            --service-account=forklift-api@$PROJECT_ID.iam.gserviceaccount.com \
            --set-secrets=API_KEY=frontend-api-key:latest,API_KEY_PREV=frontend-api-key-prev:latest \
            --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID \
            --min-instances=1 \
            --max-instances=20 \
            --concurrency=80 \
            --cpu-boost \
            --timeout=900 \
            --quiet
