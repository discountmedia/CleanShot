name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: cleanshot-493512
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPO: cleanshot-493512/cleanshot
  SERVICE: cleanshot-api

jobs:
  deploy:
    name: Build & Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set image tag
        id: tag
        run: echo "IMAGE=${{ env.REGISTRY }}/${{ env.REPO }}/api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        working-directory: apps/api
        run: |
          docker build \
            --tag "${{ steps.tag.outputs.IMAGE }}" \
            --tag "${{ env.REGISTRY }}/${{ env.REPO }}/api:cache" \
            --cache-from "${{ env.REGISTRY }}/${{ env.REPO }}/api:cache" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.tag.outputs.IMAGE }}"
          docker push "${{ env.REGISTRY }}/${{ env.REPO }}/api:cache"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="${{ steps.tag.outputs.IMAGE }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --execution-environment=gen2 \
            --cpu=1 \
            --memory=1Gi \
            --concurrency=80 \
            --min-instances=2 \
            --max-instances=50 \
            --timeout=900 \
            --cpu-boost \
            --allow-unauthenticated \
            --ingress=all \
            --service-account=forklift-api@cleanshot-493512.iam.gserviceaccount.com \
            --set-secrets="DATABASE_URL=cleanshot-database-url:latest,API_KEY=cleanshot-api-key:latest,API_KEY_PREV=cleanshot-api-key-prev:latest,OPENAI_API_KEY=cleanshot-openai-key:latest,ANTHROPIC_API_KEY=cleanshot-anthropic-key:latest,BFL_API_KEY=cleanshot-bfl-key:latest,GEMINI_API_KEY=cleanshot-gemini-key:latest,XAI_API_KEY=cleanshot-xai-key:latest,TASKS_OIDC_SA=cleanshot-tasks-oidc-sa:latest,WORKER_URL=cleanshot-worker-url:latest" \
            --set-env-vars="GCP_PROJECT=cleanshot-493512,GCP_REGION=us-central1,GCS_BUCKET_ORIGINALS=cleanshot-originals-prod,GCS_BUCKET_DERIVATIVES=cleanshot-derivatives-prod,VALKEY_URL=valkey://10.122.45.83:6379,TASKS_QUEUE_GEN=cleanshot-image-gen,TASKS_QUEUE_SCAN=cleanshot-image-scan,TASKS_LOCATION=us-central1,ENVIRONMENT=development,LOG_LEVEL=DEBUG,SCAN_PROVIDER_OPENAI=true,SCAN_PROVIDER_ANTHROPIC=true" \
            --vpc-egress=all-traffic \
            --network=default \
            --subnet=default

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
                  --region="${{ env.REGION }}" \
                  --format="value(status.url)")
          echo "Service URL: $URL"
          TOKEN=$(gcloud auth print-identity-token)
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
                    -H "Authorization: Bearer $TOKEN" \
                    "$URL/health")
          echo "Health status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

# 2026-05-19: api:cache tag was deleted before this run because a prior
# build cached pre-dual-client code and shipped it under a 18ad434-tagged
# image. This bump forces a fresh build with no stale layers so the real
# dual-Gemini-client lifespan code lands, and the new GEMINI_API_KEY
# secret mount actually activates the AI Studio path.
#
# 2026-05-20: Reve provider removed from the stack — REVE_API_KEY
# dropped from --set-secrets. cleanshot-reve-key can be deleted from
# Secret Manager once we're sure no other tools reference it.
